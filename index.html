<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#EEF3F5;--sf:#FFFFFF;--ink:#13242D;--mut:#5E727D;--ln:#D5E0E5;--ac:#0E6B5B;--acs:#D6EEE8;--neg:#C2412F;--negs:#F8DDD8;--gd:#B5821B;--gds:#F6E9C9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A20;--sf:#172730;--ink:#E7F0F3;--mut:#93A9B3;--ln:#2A3E48;--ac:#4FC3A9;--acs:#1B3A39;--neg:#F28B79;--negs:#432622;--gd:#E3B656;--gds:#3E3419;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A20;--sf:#172730;--ink:#E7F0F3;--mut:#93A9B3;--ln:#2A3E48;--ac:#4FC3A9;--acs:#1B3A39;--neg:#F28B79;--negs:#432622;--gd:#E3B656;--gds:#3E3419;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;padding-bottom:84px}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 12px;font-weight:800;letter-spacing:-.01em}
h2{font-size:17px;margin:20px 0 8px;font-weight:700}
.seg{display:flex;background:var(--ln);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:500;padding:9px 6px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--sf);color:var(--ink);font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.hero{padding:22px 18px;border-radius:18px;background:var(--ac);color:#fff;margin:14px 0 10px}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{color:#06231D}}
.hero small{opacity:.85;font-size:14px}
.hero b{display:block;font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:4px 0 0}
.row{display:flex;gap:10px}.row>*{flex:1}
.pos{color:var(--ac)}.neg{color:var(--neg)}.mut{color:var(--mut);font-size:14px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 0}
.nav button{border:1px solid var(--ln);background:var(--sf);color:var(--ink);width:40px;height:40px;border-radius:10px;font-size:18px;cursor:pointer}
.nav span{font-weight:700;text-transform:capitalize}
label{display:block;font-size:14px;color:var(--mut);margin:0 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f .full{grid-column:1/-1}
.btn{width:100%;border:0;background:var(--ac);color:#fff;font:inherit;font-weight:700;padding:12px;border-radius:10px;cursor:pointer;min-height:44px}
:root[data-theme="dark"] .btn{color:#06231D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06231D}}
.sm{width:auto;padding:8px 12px;min-height:40px}
.ghost{background:transparent;color:var(--mut);border:1px solid var(--ln);font-weight:500}
.bar{height:10px;border-radius:6px;background:var(--ln);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.bar.r i{background:var(--neg)}.bar.g i{background:var(--gd)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.li:last-child{border:0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--acs);color:var(--ac);font-weight:700;margin-left:6px}
.tag.r{background:var(--negs);color:var(--neg)}.tag.g{background:var(--gds);color:var(--gd)}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font:inherit;padding:8px;min-height:40px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;padding:10px 0;border-radius:10px;cursor:pointer;min-height:44px}
.tabs button.on{color:var(--ac);font-weight:800;background:var(--acs)}
.pay{display:flex;gap:8px;margin-top:10px}.pay input{flex:1}
.empty{text-align:center;color:var(--mut);padding:18px 8px}
.tw{overflow-x:auto;margin-top:10px;border:1px solid var(--ln);border-radius:10px}
.tbl{border-collapse:collapse;min-width:700px;width:100%;font-size:14px}
.tbl th{text-align:left;font-weight:700;padding:9px 6px;border-bottom:1px solid var(--ln);white-space:nowrap;user-select:none;background:var(--bg)}
.tbl td{border-bottom:1px solid var(--ln);padding:0}
.tbl tbody tr:nth-child(even){background:var(--bg)}
.tbl td:nth-child(1){width:150px}
.tbl input,.tbl select{border:0;border-radius:0;background:transparent;min-height:42px;padding:6px}
.lg{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}.lg i{width:12px;height:12px;border-radius:3px;flex:none}.lg span{flex:1}
</style>
</head>
<body>
<div class="w">
  <h1>Meu Caixa</h1>
  <div class="mut" id="st" style="margin:-6px 0 10px"></div>

</div>
<div class="tabs" id="tabs"></div>
<script>
const SUPABASE_URL="https://lbbufbqqfccnryahdlyu.supabase.co";
const SUPABASE_KEY="sb_publishable_6Emtvy7YT35MVuOgxnpsiA_yheAIYPU";
let sb=null,CONN={u:"",k:""};
const LS=k=>{try{return localStorage.getItem(k)||""}catch(e){return""}};
const CU=()=>CONN.u||(SUPABASE_URL.startsWith("COLE")?LS("mc_url"):SUPABASE_URL);
const CK=()=>CONN.k||(SUPABASE_KEY.startsWith("COLE")?LS("mc_key"):SUPABASE_KEY);
const brl=n=>(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num=v=>parseFloat(String(v).replace(",","."))||0;
const PF={
 pessoal:{n:"Pessoal",cats:["Moradia","Alimentação","Transporte","Saúde","Lazer","Educação","Assinaturas","Outros"],inc:["Salário","Renda extra","Rendimentos"]},
 familia:{n:"Casal/Família",cats:["Moradia","Mercado","Contas da casa","Transporte","Saúde","Filhos","Lazer","Outros"],inc:["Salário","Renda extra","Rendimentos"],who:["Eu","Parceiro(a)","Compartilhado"]},
 negocio:{n:"Negócio",cats:["Fornecedores","Impostos","Marketing","Ferramentas","Pró-labore","Transporte","Outros"],inc:["Vendas","Serviços","Outras entradas"]}
};
const TABS=[["resumo","Resumo"],["lanc","Lançar"],["graf","Gráficos"],["div","Dívidas"],["meta","Metas"],["conta","Conta"]];
const today=()=>{const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
let S={p:"pessoal",tab:"resumo",m:today().slice(0,7),ft:"d",d:{}},DB=null,UID=null,ready=false,status="Conectando…",dirty=new Set(),timer=null,localOnly=false;
try{const l=JSON.parse(localStorage.getItem("meucaixa_prefs"));if(l){if(PF[l.p])S.p=l.p;if(/^\d{4}-\d\d$/.test(l.m))S.m=l.m}}catch(e){}

const D=()=>S.d[S.p]||(S.d[S.p]={debts:[],goals:[],cfg:null,tx:{},loaded:false});
const TX=(m=S.m)=>D().tx[m]||[];
const TXA=m=>D().tx[m]||(D().tx[m]=[]);
const ref=k=>({
  async get(){const r=await sb.from("docs").select("data").eq("key",k).maybeSingle();if(r.error)throw r.error;return {exists:!!r.data,data:()=>r.data&&r.data.data}},
  async set(v){const r=await sb.from("docs").upsert({user_id:UID,key:k,data:v,updated_at:new Date().toISOString()});if(r.error)throw r.error}
});
function bar(){const e=document.getElementById("st");if(e)e.textContent=status}
function mark(k,p=S.p){dirty.add(p+"|"+k);if(localOnly){save();return}status="Salvando…";bar();clearTimeout(timer);timer=setTimeout(flush,1200)}
async function flush(){
  const ks=[...dirty];dirty.clear();
  try{for(const k of ks){const [p,t]=k.split("|");const d=S.d[p];
    if(t==="meta")await ref(p).set({debts:d.debts,goals:d.goals,cfg:d.cfg||null});
    else await ref(p+"_"+t).set({list:d.tx[t]||[]})}
    status="Salvo na nuvem ✓"}catch(e){ks.forEach(k=>dirty.add(k));status="Falha ao salvar. Tentando de novo…";timer=setTimeout(flush,8000)}
  bar();
}
async function loadMonth(m){
  if(localOnly)return;const d=D();if(d.tx[m])return;
  const s=await ref(S.p+"_"+m).get();d.tx[m]=s.exists?(s.data().list||[]):[];
}
async function loadProfile(p){
  const d=D();if(localOnly||d.loaded){await loadMonth(S.m);return}
  const s=await ref(p).get();if(s.exists){d.debts=s.data().debts||[];d.goals=s.data().goals||[];d.cfg=s.data().cfg||null}
  d.loaded=true;await loadMonth(S.m);
}
const save=()=>{try{localStorage.setItem("meucaixa_prefs",JSON.stringify({p:S.p,m:S.m}));if(localOnly)localStorage.setItem("meucaixa2",JSON.stringify({d:S.d}))}catch(e){}};
const id=()=>Date.now()+Math.random();
const sum=a=>a.reduce((s,x)=>s+x,0);
const monthName=m=>new Date(m+"-15").toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
function go(fn){fn();mark("meta");mark(S.m);save();render()}
async function nav(fn){try{fn();await loadProfile(S.p);if(S.tab==="graf")for(const m of last6())await loadMonth(m)}catch(e){status="Erro ao carregar dados."}save();render()}
function setP(p){nav(()=>S.p=p)}
async function setTab(t){S.tab=t;if(t==="graf"){try{for(const m of last6())await loadMonth(m)}catch(e){}}render()}
function shift(n){nav(()=>{const [y,m]=S.m.split("-").map(Number);const d=new Date(y,m-1+n,1);S.m=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")})}
function setT(t){S.ft=t;save();const pw=document.getElementById("ptw");if(pw)pw.style.display=t==="d"?"":"none";document.querySelectorAll("#ftb button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));$c().innerHTML=opts(t)}
const $c=()=>document.getElementById("cat");
const opts=t=>(t==="d"?PF[S.p].cats:PF[S.p].inc).map(c=>`<option>${c}</option>`).join("");
async function addTx(){
  const v=num(document.getElementById("val").value);
  if(v<=0){alert("Digite um valor maior que zero.");return}
  const w=document.getElementById("who");
  const dt=document.getElementById("dt").value||S.m+"-01";
  const mm=dt.slice(0,7);
  try{await loadMonth(mm)}catch(e){alert("Sem conexão com a nuvem. Tente de novo.");return}
  go(()=>{TXA(mm).push({id:id(),t:S.ft,v,c:$c().value,desc:document.getElementById("desc").value.trim(),dt,w:w?w.value:"",pt:(document.getElementById("pt")&&S.ft==="d")?document.getElementById("pt").value:""});S.m=mm});
}
function delTx(i){go(()=>D().tx[S.m]=TX().filter(x=>x.id!==i))}
function addDebt(){
  const n=document.getElementById("dn").value.trim(),b=num(document.getElementById("db").value);
  if(!n||b<=0){alert("Informe o nome e o saldo devedor.");return}
  go(()=>D().debts.push({id:id(),n,b,r:num(document.getElementById("dr").value),p:num(document.getElementById("dp").value)}));
}
async function payDebt(i){
  const v=num(document.getElementById("pd"+i).value);if(v<=0)return;
  const dt=today(),mm=dt.slice(0,7);
  try{await loadMonth(mm)}catch(e){alert("Sem conexão com a nuvem. Tente de novo.");return}
  go(()=>{const d=D().debts.find(x=>x.id===i);d.b=Math.max(0,d.b-v);
    TXA(mm).push({id:id(),t:"d",v,c:"Dívidas",desc:"Pagamento: "+d.n,dt,w:""})});
  mark(mm);
}
async function backup(){
  try{
    const out={v:2,profiles:{}};
    if(localOnly){Object.entries(S.d).forEach(([p,d])=>out.profiles[p]={debts:d.debts,goals:d.goals,cfg:d.cfg||null,tx:d.tx})}
    else{const q=await sb.from("docs").select("key,data");if(q.error)throw q.error;
      q.data.forEach(s=>{const [p,m]=s.key.split("_");if(!PF[p])return;const o=out.profiles[p]||(out.profiles[p]={debts:[],goals:[],tx:{}});const d=s.data||{};
        if(m)o.tx[m]=d.list||[];else{o.debts=d.debts||[];o.goals=d.goals||[];o.cfg=d.cfg||null}})}
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:"application/json"}));a.download="meu-caixa-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
  }catch(e){status="Backup não concluído";bar()}
}
function restore(el){
  const f=el.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const o=JSON.parse(r.result);if(!o.profiles)throw 0;
    if(!confirm("Restaurar este backup? Os dados dos perfis e meses do arquivo vão substituir os atuais."))return;
    Object.entries(o.profiles).forEach(([p,d])=>{if(!PF[p])return;
      const cur=S.d[p]||(S.d[p]={tx:{}});cur.debts=d.debts||[];cur.goals=d.goals||[];cur.cfg=d.cfg||null;cur.loaded=true;cur.tx=Object.assign(cur.tx||{},d.tx||{});
      mark("meta",p);Object.keys(d.tx||{}).forEach(m=>mark(m,p))});
    save();render();alert("Backup restaurado.")
  }catch(e){alert("Arquivo inválido.")}};
  r.readAsText(f);
}
function delDebt(i){go(()=>D().debts=D().debts.filter(x=>x.id!==i))}
function addGoal(){
  const n=document.getElementById("gn").value.trim(),t=num(document.getElementById("gt").value);
  if(!n||t<=0){alert("Informe o nome e o valor da meta.");return}
  go(()=>D().goals.push({id:id(),n,t,s:0}));
}
function saveGoal(i){
  const v=num(document.getElementById("gs"+i).value);if(v<=0)return;
  go(()=>{D().goals.find(x=>x.id===i).s+=v});
}
function delGoal(i){go(()=>D().goals=D().goals.filter(x=>x.id!==i))}
function months(b,r,p){
  r=r/100;if(p<=0)return null;
  if(r===0)return Math.ceil(b/p);
  if(p<=b*r)return null;
  return Math.ceil(-Math.log(1-b*r/p)/Math.log(1+r));
}
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let FL={q:"",t:"",c:"",w:""},SO={k:"dt",d:-1};
const COL=["#0E9F8A","#E0703F","#D9A441","#5B7FD6","#B35FB5","#7A8B96"];
const last6=()=>{const [y,m]=S.m.split("-").map(Number);return [5,4,3,2,1,0].map(n=>{const d=new Date(y,m-1-n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")})};
function rows(){
  const q=FL.q.toLowerCase();
  const r=TX().filter(x=>(!FL.t||x.t===FL.t)&&(!FL.c||x.c===FL.c)&&(!FL.w||x.w===FL.w)&&(!q||(x.desc||"").toLowerCase().includes(q)||x.c.toLowerCase().includes(q)));
  const k=SO.k,d=SO.d;
  return r.sort((a,b)=>(k==="v"?a.v-b.v:String(a[k]||"").localeCompare(String(b[k]||"")))*d);
}
const tot=r=>{const e=sum(r.filter(x=>x.t==="r").map(x=>x.v)),s=sum(r.filter(x=>x.t==="d").map(x=>x.v));return `<span class="mut">${r.length} linhas</span><span>Entradas <b class="pos">${brl(e)}</b> · Saídas <b class="neg">${brl(s)}</b> · Saldo <b>${brl(e-s)}</b></span>`};
function refreshTab(){const e=document.getElementById("tbw");if(e)e.innerHTML=tabBody()}
function refreshTot(){const e=document.getElementById("tot");if(e)e.innerHTML=tot(rows())}
function setF(k,v){FL[k]=v;refreshTab()}
function sortBy(k){if(SO.k===k)SO.d*=-1;else{SO.k=k;SO.d=k==="v"?-1:1}refreshTab()}
async function edTx(i,k,v){
  const x=TX().find(t=>t.id===i);if(!x)return;
  if(k==="v"){const n=num(v);if(n<=0){refreshTab();return}x.v=n}
  else if(k==="t"){x.t=v;x.c=(v==="d"?PF[S.p].cats:PF[S.p].inc)[0];if(v==="r")x.pt=""}
  else if(k==="dt"){
    if(!v){refreshTab();return}
    const nm=v.slice(0,7);
    if(nm!==S.m){
      try{await loadMonth(nm)}catch(e){alert("Sem conexão com a nuvem. Tente de novo.");refreshTab();return}
      D().tx[S.m]=TX().filter(t=>t.id!==i);x.dt=v;TXA(nm).push(x);mark(S.m);mark(nm);save();refreshTab();return}
    x.dt=v}
  else x[k]=v;
  mark(S.m);save();
  if(k==="t")refreshTab();else refreshTot();
}
function tabBody(){
  const r=rows(),fam=S.p==="familia",W=PF.familia.who,P=PF[S.p];
  const th=(k,n)=>`<th onclick="sortBy('${k}')" style="cursor:pointer">${n}${SO.k===k?(SO.d>0?" ▲":" ▼"):""}</th>`;
  const body=r.map(x=>{
    const cl=x.t==="d"?P.cats:P.inc,cs=cl.includes(x.c)?cl:[x.c,...cl];
    return `<tr><td><input type="date" value="${x.dt}" aria-label="Data" onchange="edTx(${x.id},'dt',this.value)"></td>
    <td><input value="${esc(x.desc)}" placeholder="${esc(x.c)}" aria-label="Descrição" onchange="edTx(${x.id},'desc',this.value)"></td>
    <td><select aria-label="Categoria" onchange="edTx(${x.id},'c',this.value)">${cs.map(c=>`<option${c===x.c?" selected":""}>${esc(c)}</option>`).join("")}</select></td>
    ${fam?`<td><select aria-label="Quem" onchange="edTx(${x.id},'w',this.value)">${W.map(w=>`<option${w===x.w?" selected":""}>${w}</option>`).join("")}</select></td>`:""}
    <td><select aria-label="Tipo" onchange="edTx(${x.id},'t',this.value)"><option value="d"${x.t==="d"?" selected":""}>Despesa</option><option value="r"${x.t==="r"?" selected":""}>Receita</option></select></td>
    <td><input inputmode="decimal" class="${x.t==="d"?"neg":"pos"}" style="text-align:right;font-weight:700" value="${String(x.v).replace(".",",")}" aria-label="Valor" onchange="edTx(${x.id},'v',this.value)"></td>
    <td><button class="x" onclick="delTx(${x.id})" aria-label="Remover lançamento">✕</button></td></tr>`}).join("");
  return `<div class="tw"><table class="tbl"><thead><tr>${th("dt","Data")}<th>Descrição</th>${th("c","Categoria")}${fam?"<th>Quem</th>":""}<th>Tipo</th>${th("v","Valor")}<th></th></tr></thead><tbody>${body||`<tr><td colspan="7" class="empty">Nenhum lançamento encontrado.</td></tr>`}</tbody></table></div>
  <div class="li" style="border:0;flex-wrap:wrap" id="tot">${tot(r)}</div>`;
}
function vTabela(){
  const fam=S.p==="familia",P=PF[S.p],all=[...new Set([...P.cats,...P.inc,...TX().map(x=>x.c)])];
  return `<div class="card"><div class="f"><div class="full"><input id="fq" placeholder="Buscar por descrição ou categoria" value="${esc(FL.q)}" oninput="setF('q',this.value)" aria-label="Buscar"></div>
  <div><select onchange="setF('t',this.value)" aria-label="Filtrar por tipo"><option value="">Todos os tipos</option><option value="d"${FL.t==="d"?" selected":""}>Despesas</option><option value="r"${FL.t==="r"?" selected":""}>Receitas</option></select></div>
  <div><select onchange="setF('c',this.value)" aria-label="Filtrar por categoria"><option value="">Todas as categorias</option>${all.map(c=>`<option${c===FL.c?" selected":""}>${esc(c)}</option>`).join("")}</select></div>
  ${fam?`<div class="full"><select onchange="setF('w',this.value)" aria-label="Filtrar por pessoa"><option value="">Todas as pessoas</option>${PF.familia.who.map(w=>`<option${w===FL.w?" selected":""}>${w}</option>`).join("")}</select></div>`:""}
  </div><div class="mut" style="margin-top:8px">Toque em qualquer célula para editar. Toque no título Data, Categoria ou Valor para ordenar.</div><div id="tbw">${tabBody()}</div></div>`;
}
function vGraf(){
  const ms=last6(),t=ms.map(m=>({m,r:sum(TX(m).filter(x=>x.t==="r").map(x=>x.v)),d:sum(TX(m).filter(x=>x.t==="d").map(x=>x.v))}));
  const mx=Math.max(1,...t.map(a=>Math.max(a.r,a.d))),W=340,H=170,pb=26,ph=H-pb-10,bw=14;
  const bars=t.map((a,i)=>{const x=10+i*54,hr=a.r/mx*ph,hd=a.d/mx*ph;
    return `<rect x="${x}" y="${H-pb-hr}" width="${bw}" height="${hr}" rx="3" style="fill:var(--ac)"><title>Entradas ${brl(a.r)}</title></rect><rect x="${x+bw+3}" y="${H-pb-hd}" width="${bw}" height="${hd}" rx="3" style="fill:var(--neg)"><title>Saídas ${brl(a.d)}</title></rect><text x="${x+bw}" y="${H-8}" text-anchor="middle" font-size="11" style="fill:var(--mut)">${a.m.slice(5)}/${a.m.slice(2,4)}</text>`}).join("");
  const any=t.some(a=>a.r>0||a.d>0);
  const by={};TX().filter(x=>x.t==="d").forEach(x=>by[x.c]=(by[x.c]||0)+x.v);
  let es=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  if(es.length>6){const o=sum(es.slice(5).map(e=>e[1]));es=[...es.slice(0,5),["Outras",o]]}
  const T=sum(es.map(e=>e[1])),C=2*Math.PI*50;let off=0;
  const segs=es.map(([n,v],i)=>{const l=v/T*C;const c=`<circle cx="70" cy="70" r="50" fill="none" stroke="${COL[i]}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(n)} ${brl(v)}</title></circle>`;off+=l;return c}).join("");
  return `<div class="nav"><button onclick="shift(-1)" aria-label="Mês anterior">‹</button><span>${monthName(S.m)}</span><button onclick="shift(1)" aria-label="Próximo mês">›</button></div>
  <h2>Entradas e saídas (6 meses)</h2><div class="card">${any?`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de barras de entradas e saídas dos últimos 6 meses"><line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" style="stroke:var(--ln)"/>${bars}</svg>
  <div class="lg"><i style="background:var(--ac)"></i><span>Entradas</span><i style="background:var(--neg)"></i><span>Saídas</span></div>`:`<div class="empty">Sem lançamentos nos últimos 6 meses.</div>`}</div>
  <h2>Despesas por categoria</h2><div class="card">${T>0?`<svg viewBox="0 0 140 140" width="200" height="200" style="display:block;margin:0 auto" role="img" aria-label="Gráfico de rosca das despesas por categoria">${segs}<text x="70" y="66" text-anchor="middle" font-size="10" style="fill:var(--mut)">Total</text><text x="70" y="82" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--ink)">${brl(T)}</text></svg>
  <div style="margin-top:8px">${es.map(([n,v],i)=>`<div class="lg"><i style="background:${COL[i]}"></i><span>${esc(n)}</span><b>${brl(v)}</b><span class="mut" style="flex:none;width:42px;text-align:right">${Math.round(v/T*100)}%</span></div>`).join("")}</div>`:`<div class="empty">Sem despesas neste mês.</div>`}</div>`;
}
const POTES=[["casa","Contas da casa"],["guardar","Guardar"],["investir","Investir"],["juntos","Saídas juntos"],["pessoal","Pessoal"]];
const CFG=()=>D().cfg||{modo:"casal",jw:"Eu",pct:{casa:50,guardar:10,investir:10,juntos:10,pessoal:20}};
function saveCfg(){
  const pct={};let t=0;
  POTES.forEach(([k])=>{pct[k]=num(document.getElementById("pc_"+k).value);t+=pct[k]});
  if(Math.round(t)!==100){alert("As porcentagens somam "+t+"%. Ajuste para somar 100%.");return}
  go(()=>D().cfg={modo:document.getElementById("cm").value,jw:document.getElementById("cj").value,pct});
}
function vPotes(tx){
  const c=CFG(),P=c.pct,W=PF.familia.who,nam=c.modo==="namorados",jw=c.jw,other=jw===W[0]?W[1]:W[0];
  const inc=w=>sum(tx.filter(x=>x.t==="r"&&(!w||x.w===w)).map(x=>x.v));
  const spent=(k,w)=>sum(tx.filter(x=>x.t==="d"&&x.pt===k&&(!w||x.w===w)).map(x=>x.v));
  const I=nam?inc(jw):inc();
  const pb=(n,pl,us)=>{const o=us>pl,p=pl>0?Math.min(100,us/pl*100):(us>0?100:0);return `<div style="margin-bottom:12px"><div class="li" style="padding:0;border:0"><span>${n}</span><span class="${o?"neg":""}">${brl(us)} de ${brl(pl)}</span></div><div class="bar ${o?"r":""}"><i style="width:${p}%"></i></div><div class="mut">${o?"Passou "+brl(us-pl):"Restam "+brl(pl-us)}</div></div>`};
  let h=POTES.slice(0,4).map(([k,n])=>pb(n,I*P[k]/100,spent(k))).join("");
  const pp=nam?{[jw]:I*P.pessoal/100,[other]:inc(other)}:{[W[0]]:I*P.pessoal/200,[W[1]]:I*P.pessoal/200};
  h+=W.slice(0,2).map(w=>pb("Pessoal · "+w,pp[w],spent("pessoal",w))).join("");
  const sel=(v,a)=>v===a?" selected":"";
  return `<h2>Potes do casal</h2><div class="card">${I>0?"":`<div class="mut" style="margin-bottom:10px">Lance as receitas do mês (com o campo Quem) para calcular o valor de cada pote.</div>`}${h}<div class="mut">${nam?"Modo namorados: a renda de "+other+" fica só com ele(a); a de "+jw+" é dividida nos potes.":"Toda a renda do casal é dividida nos potes, e a parte pessoal é igual para os dois."}</div></div>
  <details class="card"><summary><b>Configurar divisão</b></summary><div class="f" style="margin-top:10px">
  <div class="full"><label for="cm">Tipo de casal</label><select id="cm"><option value="casal"${sel(c.modo,"casal")}>Casados / moram juntos</option><option value="namorados"${sel(c.modo,"namorados")}>Namorados (a renda de um é só dele/dela)</option></select></div>
  <div class="full"><label for="cj">Renda compartilhada é de (só namorados)</label><select id="cj">${W.slice(0,2).map(w=>`<option${sel(w,jw)}>${w}</option>`).join("")}</select></div>
  ${POTES.map(([k,n])=>`<div><label for="pc_${k}">${n} (%)</label><input id="pc_${k}" inputmode="decimal" value="${P[k]}"></div>`).join("")}
  <div class="full mut">Em Pessoal, a porcentagem é a soma dos dois (dividida igualmente).</div>
  <div class="full"><button class="btn" onclick="saveCfg()">Salvar divisão</button></div></div></details>`;
}
function vResumo(){
  const tx=TX();
  const inc=sum(tx.filter(x=>x.t==="r").map(x=>x.v)),exp=sum(tx.filter(x=>x.t==="d").map(x=>x.v));
  const bal=inc-exp,biz=S.p==="negocio";
  const by={};tx.filter(x=>x.t==="d").forEach(x=>by[x.c]=(by[x.c]||0)+x.v);
  const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  let tip="";
  if(inc>0){
    const pct=Math.round(bal/inc*100);
    tip=biz?`Margem do mês: <b>${pct}%</b>. Separe o dinheiro dos impostos assim que a venda entrar e retire só o pró-labore combinado.`
      :`Você guardou <b>${pct}%</b> da renda. Uma referência comum é 50% para o essencial, 30% para o que é desejo e 20% para guardar ou quitar dívidas.`;
  }else tip="Registre suas entradas na aba Lançamentos para ver quanto sobra.";
  let who="";
  if(PF[S.p].who&&exp>0){who=`<div class="card"><b>Gastos por pessoa</b>`+PF[S.p].who.map(w=>`<div class="li"><span>${w}</span><span>${brl(sum(tx.filter(x=>x.t==="d"&&x.w===w).map(x=>x.v)))}</span></div>`).join("")+`</div>`}
  const res=exp*6;
  return `<div class="nav"><button onclick="shift(-1)" aria-label="Mês anterior">‹</button><span>${monthName(S.m)}</span><button onclick="shift(1)" aria-label="Próximo mês">›</button></div>
  <div class="hero"><small>Sobrou no mês</small><b>${brl(bal)}</b></div>
  <div class="row"><div class="card"><div class="mut">Entrou</div><b class="pos">${brl(inc)}</b></div><div class="card"><div class="mut">Saiu</div><b class="neg">${brl(exp)}</b></div></div>
  <div class="card">${tip}</div>
  ${S.p==="familia"?vPotes(tx):""}
  <h2>Para onde foi o dinheiro</h2>
  ${cats.length?`<div class="card">`+cats.map(([c,v])=>`<div style="margin-bottom:12px"><div class="li" style="padding:0;border:0"><span>${c}</span><span>${brl(v)} <span class="mut">${Math.round(v/exp*100)}%</span></span></div><div class="bar"><i style="width:${v/exp*100}%"></i></div></div>`).join("")+`</div>`:`<div class="card empty">Nenhuma despesa neste mês. Adicione a primeira em Lançamentos.</div>`}
  ${who}
  ${exp>0?`<div class="card"><b>Reserva de emergência</b><div class="mut">Com os gastos deste mês, o ideal é ter cerca de <b>${brl(res)}</b> guardados (6 meses).${biz?" Para negócio, 3 meses já ajudam muito.":""}</div></div>`:""}`;
}
function vLanc(){
  const tx=[...TX()].sort((a,b)=>b.dt.localeCompare(a.dt));
  const who=PF[S.p].who;
  return `<h2>Novo lançamento</h2><div class="card"><div class="seg" id="ftb" style="margin-bottom:12px">
   <button data-t="d" class="${S.ft==="d"?"on":""}" onclick="setT('d')">Despesa</button><button data-t="r" class="${S.ft==="r"?"on":""}" onclick="setT('r')">Receita</button></div>
   <div class="f"><div><label for="val">Valor (R$)</label><input id="val" inputmode="decimal" placeholder="0,00"></div>
   <div><label for="dt">Data</label><input id="dt" type="date" value="${today()}"></div>
   <div class="${who?"":"full"}"><label for="cat">Categoria</label><select id="cat">${opts(S.ft)}</select></div>
   ${who?`<div><label for="who">Quem</label><select id="who">${who.map(w=>`<option>${w}</option>`).join("")}</select></div>`:""}
   ${who?`<div class="full" id="ptw" style="${S.ft==="d"?"":"display:none"}"><label for="pt">Pote do orçamento</label><select id="pt">${POTES.map(([k,n])=>`<option value="${k}">${n}</option>`).join("")}</select></div>`:""}
   <div class="full"><label for="desc">Descrição (opcional)</label><input id="desc" placeholder="Ex.: mercado da semana"></div>
   <div class="full"><button class="btn" onclick="addTx()">Salvar lançamento</button></div></div></div>
   <div class="nav"><button onclick="shift(-1)" aria-label="Mês anterior">‹</button><span>${monthName(S.m)}</span><button onclick="shift(1)" aria-label="Próximo mês">›</button></div>${vTabela()}`;
}
function vDiv(){
  const ds=[...D().debts].sort((a,b)=>b.r-a.r);
  const open=ds.filter(d=>d.b>0);
  return `<h2>Dívidas</h2>
  ${open.length?`<div class="card">Total devendo: <b class="neg">${brl(sum(open.map(d=>d.b)))}</b><div class="mut">Método avalanche: pague o mínimo de todas e coloque todo o extra na dívida com maior juros. É o que mais economiza.</div></div>`:""}
  ${ds.map((d,i)=>{const n=months(d.b,d.r,d.p);return `<div class="card"><div class="li" style="border:0;padding:0"><div><b>${d.n}</b>${d.b<=0?`<span class="tag">Quitada</span>`:i===0?`<span class="tag r">Pague primeiro</span>`:""}</div><button class="x" onclick="delDebt(${d.id})">Remover</button></div>
   <div class="mut">Saldo ${brl(d.b)} · juros ${d.r}% ao mês · parcela ${brl(d.p)}</div>
   ${d.b>0?`<div class="mut">${d.p>0?(n?`Quitação em cerca de <b>${n}</b> meses pagando a parcela.`:"A parcela não cobre os juros. Aumente o valor pago."):"Defina uma parcela para estimar o prazo."}</div>
   <div class="pay"><input id="pd${d.id}" inputmode="decimal" placeholder="Valor pago" aria-label="Valor pago"><button class="btn sm" onclick="payDebt(${d.id})">Registrar</button></div>`:""}</div>`}).join("")||`<div class="card empty">Nenhuma dívida cadastrada. Se você não tem, ótimo! Se tem, adicione abaixo.</div>`}
  <h2>Adicionar dívida</h2><div class="card"><div class="f">
   <div class="full"><label for="dn">Nome</label><input id="dn" placeholder="Ex.: cartão, financiamento"></div>
   <div><label for="db">Saldo devedor (R$)</label><input id="db" inputmode="decimal"></div>
   <div><label for="dr">Juros ao mês (%)</label><input id="dr" inputmode="decimal" placeholder="0"></div>
   <div class="full"><label for="dp">Parcela mensal (R$)</label><input id="dp" inputmode="decimal"></div>
   <div class="full"><button class="btn" onclick="addDebt()">Salvar dívida</button></div></div></div>`;
}
function vMeta(){
  const gs=D().goals;
  return `<h2>Metas de poupar e investir</h2>
  ${gs.map(g=>{const p=Math.min(100,g.s/g.t*100);return `<div class="card"><div class="li" style="border:0;padding:0"><div><b>${g.n}</b>${p>=100?`<span class="tag g">Meta batida</span>`:""}</div><button class="x" onclick="delGoal(${g.id})">Remover</button></div>
   <div class="mut">${brl(g.s)} de ${brl(g.t)} · ${Math.round(p)}%</div><div class="bar g"><i style="width:${p}%"></i></div>
   ${p<100?`<div class="pay"><input id="gs${g.id}" inputmode="decimal" placeholder="Quanto guardou" aria-label="Quanto guardou"><button class="btn sm" onclick="saveGoal(${g.id})">Guardar</button></div>`:""}</div>`}).join("")||`<div class="card empty">Nenhuma meta ainda. Comece pela reserva de emergência, depois viagem, imóvel ou aposentadoria.</div>`}
  <h2>Nova meta</h2><div class="card"><div class="f">
   <div class="full"><label for="gn">Nome</label><input id="gn" placeholder="Ex.: reserva de emergência"></div>
   <div class="full"><label for="gt">Valor da meta (R$)</label><input id="gt" inputmode="decimal"></div>
   <div class="full"><button class="btn" onclick="addGoal()">Criar meta</button></div></div></div>`;
}
function vConta(){
  return `<h2>Sua conta</h2><div class="card"><b>${localOnly?"Modo local":"Nuvem ativa"}</b><div class="mut" style="margin-top:6px">${localOnly?"Você não está conectado. Entre na sua conta Claude e reabra o link para salvar na nuvem. Por enquanto os dados ficam só neste aparelho.":"Seu login é o e-mail cadastrado. Os outros usuários não veem seus lançamentos, dívidas ou metas. Quem administra o projeto no Supabase tem acesso técnico ao banco."}</div></div>
  <div style="margin-top:10px"><button class="btn ghost" onclick="logout()">Sair da conta</button></div><h2>Backup</h2><div class="card"><div class="mut" style="margin-bottom:10px">Baixe uma cópia de todos os perfis ou restaure uma cópia anterior.</div><button class="btn" onclick="backup()">Baixar backup</button><div style="height:12px"></div><label for="rf">Restaurar de um arquivo</label><input id="rf" type="file" accept=".json,application/json" onchange="restore(this)"></div>`;
}
function render(){
  if(!ready){document.getElementById("app").innerHTML='<div class="card empty">Carregando seus dados…</div>';bar();return}
  if(!UID){document.getElementById("prof").innerHTML="";document.getElementById("tabs").innerHTML="";document.getElementById("app").innerHTML=vLogin();bar();return}
  document.getElementById("prof").innerHTML=Object.entries(PF).map(([k,v])=>`<button class="${S.p===k?"on":""}" onclick="setP('${k}')">${v.n}</button>`).join("");
  document.getElementById("tabs").innerHTML=TABS.map(([k,n])=>`<button class="${S.tab===k?"on":""}" onclick="setTab('${k}')">${n}</button>`).join("");
  document.getElementById("app").innerHTML={resumo:vResumo,lanc:vLanc,graf:vGraf,div:vDiv,meta:vMeta,conta:vConta}[S.tab]();bar();
}
function vLogin(){
  if(!window.supabase)return `<h2>Sem conexão</h2><div class="card" style="background:var(--negs);border-color:var(--neg)"><b>Não foi possível carregar o Supabase.</b><div class="mut">Verifique a internet e abra o app pelo link publicado (não dentro do Claude). Se continuar, o navegador pode estar bloqueando scripts externos.</div></div>`;
  if(!CU()||!CK())return `<h2>Conectar ao Supabase</h2><div class="card"><div class="mut" style="margin-bottom:10px">Cole os dados do seu projeto (Project Settings, API). Ficam salvos só neste aparelho.</div><div class="f"><div class="full"><label for="cu">Project URL</label><input id="cu" placeholder="https://xxxx.supabase.co" autocapitalize="none" autocomplete="off"></div><div class="full"><label for="ck">Chave anon / publishable</label><input id="ck" placeholder="Cole a chave completa" autocapitalize="none" autocomplete="off"></div><div class="full" id="lmsg" role="alert"></div><div class="full"><button class="btn" onclick="saveConn()">Testar e conectar</button></div></div></div>`;
  return `<h2>Entrar</h2><div class="card"><div class="f"><div class="full"><label for="em">E-mail</label><input id="em" type="email" autocomplete="username" autocapitalize="none"></div><div class="full"><label for="pw">Senha (mínimo 6 caracteres)</label><div style="display:flex;gap:8px"><input id="pw" type="password" autocomplete="current-password"><button class="btn ghost sm" type="button" id="pwb" onclick="togglePw()" aria-label="Mostrar ou ocultar a senha">Mostrar</button></div></div><div class="full" id="lmsg" role="alert"></div><div class="full"><button class="btn" onclick="auth(false)">Entrar</button></div><div class="full"><button class="btn ghost" onclick="auth(true)">Criar conta</button></div></div></div>`}
async function saveConn(){
  const u=document.getElementById("cu").value.trim().replace(/\/+$/,""),k=document.getElementById("ck").value.trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u)){lmsg("A URL deve ser parecida com https://xxxx.supabase.co (sem nada depois de .co).");return}
  if(k.length<20){lmsg("Cole a chave anon/publishable completa.");return}
  lmsg("Testando conexão…",true);
  try{const r=await fetch(u+"/auth/v1/settings",{headers:{apikey:k}});
    if(!r.ok){lmsg(r.status===401||r.status===403?"A chave foi recusada. Confira se copiou a chave anon/publishable.":"O Supabase respondeu com erro "+r.status+". Confira a URL.");return}
  }catch(e){lmsg("Não foi possível alcançar o Supabase. Confira a URL e a internet.");return}
  CONN={u,k};try{localStorage.setItem("mc_url",u);localStorage.setItem("mc_key",k)}catch(e){}
  ready=false;init();
}
function togglePw(){const i=document.getElementById("pw"),b=document.getElementById("pwb"),show=i.type==="password";i.type=show?"text":"password";b.textContent=show?"Ocultar":"Mostrar"}
function lmsg(t,ok){const e=document.getElementById("lmsg");if(e){e.textContent=t;e.className="full "+(ok?"pos":"neg")}}
function traduz(m){m=m||"";if(/Invalid login/i.test(m))return"E-mail ou senha incorretos (ou conta ainda não confirmada).";if(/already registered/i.test(m))return"Este e-mail já tem conta. Use Entrar.";if(/not confirmed/i.test(m))return"Confirme seu e-mail pelo link enviado.";if(/rate limit/i.test(m))return"Muitas tentativas. Aguarde alguns minutos.";if(/Password should/i.test(m))return"Senha fraca: use ao menos 6 caracteres.";return m}
async function auth(sign){
  const e=document.getElementById("em").value.trim(),p=document.getElementById("pw").value;
  if(!sb){lmsg("App sem configuração: faltam a URL e a chave do Supabase no index.html.");return}
  if(!e||p.length<6){lmsg("Informe e-mail e senha (mínimo 6 caracteres).");return}
  lmsg("Aguarde…",true);
  try{
    const r=sign?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});
    if(r.error){lmsg(traduz(r.error.message));return}
    if(r.data.session)await enter(r.data.user);
    else lmsg("Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.",true);
  }catch(err){lmsg("Não foi possível conectar ao Supabase. Confira a URL e a chave no index.html e a internet.")}
}
async function enter(u){UID=u.id;DB=true;localOnly=false;status="Conectado: "+u.email;try{await loadProfile(S.p)}catch(e){status="Erro ao carregar. Recarregue a página."}ready=true;render()}
async function logout(){await sb.auth.signOut();UID=null;DB=null;S.d={};dirty.clear();status="Você saiu da conta";render()}
async function init(){
  render();
  if(!window.supabase||!CU()||!CK()){ready=true;status="Falta conectar ao Supabase";render();return}
  sb=supabase.createClient(CU(),CK());
  const r=await sb.auth.getSession();
  if(r.data.session)await enter(r.data.session.user);else{ready=true;status="Entre para continuar";render()}
}
init();
</script>
</body>
</html>
